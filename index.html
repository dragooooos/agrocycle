<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="AgroCycle - Smart crop rotation decision support"
    />

    <title>
      AgroCycle — Climate-smart crop decisions
    </title>

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Home page only: start downloading the 3D globe model (EarthScene.tsx) before the app has loaded. -->
    <script>
      if (location.pathname === "/") {
        const link = document.createElement("link");
        link.rel = "preload";
        link.href = "/earth.glb";
        link.as = "fetch";
        link.crossOrigin = "anonymous";
        document.head.appendChild(link);
      }
    </script>
</head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
